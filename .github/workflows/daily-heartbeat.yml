name: Daily repository heartbeat

on:
  schedule:
    # 03:17 Moscow time (UTC+3), away from GitHub's busiest minute.
    - cron: "17 0 * * *"
    # Backup run at 15:43 Moscow time; it is a no-op if today's entry exists.
    - cron: "43 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-repository-heartbeat
  cancel-in-progress: false

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Append today's heartbeat
        env:
          TZ: Europe/Moscow
        run: |
          month="$(date +'%Y-%m')"
          timestamp="$(date +'%Y-%m-%d %H:%M:%S %Z')"
          log_file="activity/${month}.md"
          today="$(date +'%Y-%m-%d')"

          if [ ! -f "$log_file" ]; then
            printf '# Activity for %s\n\n' "$month" > "$log_file"
          fi

          if ! grep -q -- "^- ${today} " "$log_file"; then
            printf -- '- %s — automated repository heartbeat\n' "$timestamp" >> "$log_file"
          fi

      - name: Commit and push
        env:
          TZ: Europe/Moscow
        run: |
          git config user.name "George"
          git config user.email "61087097+studygeorge@users.noreply.github.com"
          git add activity/
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily heartbeat $(date +'%Y-%m-%d')"
          git push
