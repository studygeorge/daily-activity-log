name: Daily contribution art

on:
  schedule:
    # 03:17 Moscow time (UTC+3), away from GitHub's busiest minute.
    - cron: "17 0 * * *"
    # Backup run at 15:43 Moscow time; it is a no-op if today's entry exists.
    - cron: "43 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution-art
  cancel-in-progress: false

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5

      - name: Create today's contribution-art commits
        env:
          TZ: Europe/Moscow
        run: |
          git config user.name "George"
          git config user.email "61087097+studygeorge@users.noreply.github.com"

          art_start="2026-09-06"
          month="$(date +'%Y-%m')"
          timestamp="$(date +'%Y-%m-%d %H:%M:%S %Z')"
          log_file="activity/${month}.md"
          today="$(date +'%Y-%m-%d')"
          start_epoch="$(date -d "$art_start" +%s)"
          today_epoch="$(date -d "$today" +%s)"
          day_offset="$(( (today_epoch - start_epoch) / 86400 ))"
          target=1
          symbol="B"

          # Rows are Sunday through Saturday; columns are consecutive weeks.
          pattern=(
            ".DDDDD."
            "D.....D"
            "D.M.M.D"
            "D.....D"
            "D.M.M.D"
            "D..M..D"
            ".DDDDD."
          )

          if [ "$day_offset" -ge 0 ] && [ "$day_offset" -lt 49 ]; then
            column="$(( day_offset / 7 ))"
            row="$(( day_offset % 7 ))"
            symbol="${pattern[$row]:$column:1}"

            case "$symbol" in
              D) target=12 ;;
              M) target=6 ;;
              .) target=1 ;;
            esac
          fi

          if [ ! -f "$log_file" ]; then
            printf '# Activity for %s\n\n' "$month" > "$log_file"
          fi

          completed="$(grep -c -- "^- ${today} .*pulse" "$log_file" || true)"

          if [ "$completed" -ge "$target" ]; then
            exit 0
          fi

          for pulse in $(seq "$(( completed + 1 ))" "$target"); do
            printf -- '- %s — art %s, pulse %02d/%02d\n' \
              "$timestamp" "$symbol" "$pulse" "$target" >> "$log_file"
            git add "$log_file"
            git commit -m "art: ${today} pulse ${pulse}/${target}"
          done

          git push
